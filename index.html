<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>머지 레스토랑</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#FFF8F0;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow:hidden;height:100dvh;display:flex;flex-direction:column;touch-action:none}
.cell{border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.4em,4vw,2em);cursor:pointer;user-select:none;position:relative;aspect-ratio:1}
.cell.open{background:#FEF3C7;border:2px solid #FCD34D}
.cell.locked{background:#E5E7EB;border:2px dashed #9CA3AF;cursor:pointer;font-size:0.7em}
.cell.drag-hi{background:#FDE68A!important;border-color:#F59E0B!important}
/* 주문 하이라이트 */
@keyframes ordered{0%,100%{box-shadow:0 0 0 2px #10B981}50%{box-shadow:0 0 0 5px #10B981,0 0 12px rgba(16,185,129,.45)}}
.cell.ordered{animation:ordered 1.4s ease-in-out infinite;border-color:#10B981!important;background:#ECFDF5!important}
.gen-btn{background:#D1FAE5;border:2px solid #34D399;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;cursor:pointer;user-select:none;transition:transform .1s;min-height:60px}
.gen-btn.pressed{transform:scale(.93)}
.gen-btn.locked{background:#F3F4F6;border-color:#D1D5DB;opacity:.55;cursor:default}
.cslot{background:#FEF3C7;border:2px solid #FCD34D;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:5px 3px;position:relative;flex:1;min-width:0}
.cslot.empty{background:#F9FAFB;border-color:#D1D5DB;border-style:dashed}
.cslot.drop-hi{border:3px solid #F59E0B!important;background:#FFFBEB!important}
.pbar{width:100%;height:5px;border-radius:3px;background:#E5E7EB;overflow:hidden;margin-top:2px}
.pfill{height:100%;border-radius:3px;transition:width .6s,background .6s}
.ghost{position:fixed;pointer-events:none;z-index:1000;font-size:2.5em;transform:translate(-50%,-55%);filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));line-height:1}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes fadeup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-55px)}}
@keyframes coinfly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.4)}}
@keyframes lvup{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.anim-pop{animation:pop .28s ease-out}
.float-el{position:fixed;pointer-events:none;z-index:999;animation:fadeup .85s ease-out forwards}
.coin-el{position:fixed;pointer-events:none;z-index:999;font-size:1.1em;animation:coinfly .55s ease-in forwards}
.lvup-el{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2000;pointer-events:none;animation:lvup 2s ease-out forwards}
.do-shake{animation:shake .25s ease-out}
</style>
</head>
<body>

<!-- HUD -->
<div id="hud" class="flex items-center gap-2 px-3 py-2 bg-amber-600 text-white text-sm font-bold shadow flex-shrink-0">
  <span id="h-coin">🪙 0</span>
  <span id="h-gem">💎 0</span>
  <span id="h-lv">⭐Lv.1</span>
  <div class="flex-1"></div>
  <span id="h-en">⚡0/20</span>
  <div class="w-14 h-2 bg-amber-800 rounded-full overflow-hidden">
    <div id="en-bar" class="h-full bg-yellow-300 rounded-full" style="width:100%"></div>
  </div>
  <span id="en-cd" class="text-xs opacity-75 w-8 text-right"></span>
</div>
<div class="h-1.5 bg-amber-100 flex-shrink-0">
  <div id="xp-bar" class="h-full bg-amber-500 transition-all duration-300" style="width:0%"></div>
</div>

<!-- Main -->
<div class="flex flex-1 gap-1 px-1.5 py-1 overflow-hidden min-h-0">
  <div id="gens" class="flex flex-col gap-1.5 w-14 flex-shrink-0 overflow-y-auto pb-1"></div>
  <div class="flex-1 overflow-hidden flex items-start">
    <div id="board" class="grid gap-1" style="grid-template-columns:repeat(6,1fr);width:100%"></div>
  </div>
</div>

<!-- Customers -->
<div class="px-2 py-1 flex-shrink-0">
  <div class="text-xs text-amber-700 font-bold mb-1">👥 손님</div>
  <div id="custs" class="flex gap-1.5"></div>
</div>

<!-- Bottom Nav -->
<div class="flex border-t border-amber-100 bg-white flex-shrink-0">
  <button onclick="openShop()" class="flex-1 py-1.5 text-center text-xs text-amber-700 active:bg-amber-50">🛒<br>상점</button>
  <button onclick="openDex()" class="flex-1 py-1.5 text-center text-xs text-amber-700 active:bg-amber-50">📖<br>도감</button>
  <button onclick="claimDaily()" class="flex-1 py-1.5 text-center text-xs text-amber-700 active:bg-amber-50">🎁<br>일일</button>
  <button onclick="openSettings()" class="flex-1 py-1.5 text-center text-xs text-amber-700 active:bg-amber-50">⚙️<br>설정</button>
</div>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-3">
  <div id="modal-body" class="bg-white rounded-2xl p-5 w-full max-w-xs shadow-xl max-h-[80dvh] overflow-y-auto"></div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed top-16 left-1/2 -translate-x-1/2 bg-gray-800/90 text-white text-sm px-4 py-2 rounded-full z-[999] pointer-events-none text-center max-w-xs"></div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────
const COLS=6,ROWS=8,TOTAL=COLS*ROWS,MAX_EN=20,REGEN_MS=60000,SAVE='merge_restaurant_v1';

const TRAILS={
  tomato:{
    gen:{icon:'🌱',name:'토마토 텃밭'},
    items:[
      {name:'방울토마토', icon:'🍅', coins:0,   patience:0},
      {name:'토마토',     icon:'🍅', coins:10,  patience:30},
      {name:'토마토 슬라이스', icon:'🍅', coins:25, patience:45},  // 🔪 제거
      {name:'토마토 소스', icon:'🥫', coins:60,  patience:60},
      {name:'마르게리타 피자', icon:'🍕', coins:150, patience:90},
    ]
  },
  bread:{
    gen:{icon:'🌾',name:'밀밭'},
    items:[
      {name:'밀',     icon:'🌾', coins:0,   patience:0},
      {name:'반죽',   icon:'🫓', coins:12,  patience:30},
      {name:'빵',     icon:'🍞', coins:30,  patience:45},
      {name:'샌드위치', icon:'🥪', coins:70,  patience:60},
      {name:'햄버거', icon:'🍔', coins:160, patience:90},
    ]
  },
  meat:{
    gen:{icon:'🐄',name:'정육점'},
    items:[
      {name:'생고기',    icon:'🥩', coins:0,   patience:0},
      {name:'다진고기',  icon:'🔪', coins:15,  patience:35},  // 칼 = 다지는 동작
      {name:'패티',      icon:'🫓', coins:35,  patience:50},
      {name:'스테이크',  icon:'🍖', coins:80,  patience:65},
      {name:'비프 플래터', icon:'🫕', coins:200, patience:90},
    ]
  }
};
const TK=Object.keys(TRAILS);

const LV_XP=[0,0,100,250,500,900,1400,2000,2800,3800,5000];
const LV_REWARD={
  2:{unlockExtra:6, gems:5, msg:'셀 6칸 추가 해금! 💎+5'},
  3:{gen:'bread',   gems:5, msg:'밀밭 생성기 해금! 💎+5'},
  5:{maxCust:4,     gems:5, msg:'손님 자리 4개로 확장! 💎+5'},
  7:{gen:'meat',    gems:5, msg:'정육점 생성기 해금! 💎+5'},
};
const CEMOJI=['👨','👩','👦','👧','👴','👵','🧑','👱','🧔','👮'];

function unlockCost(idx){
  const row=Math.floor(idx/COLS);
  if(row<3)return 0;
  return([30,60,100,200,300][row-3]??500);
}

// ── STATE ─────────────────────────────────────────────────────────
let S={};

function defState(){
  return{
    coins:500, gems:10, energy:MAX_EN, energyLastAt:Date.now(),
    level:1, xp:0, reputation:5,
    board:Array(TOTAL).fill(null),
    unlocked:Array.from({length:18},(_,i)=>i),
    unlockedGens:['tomato'],
    unlockedTrails:['tomato'],
    maxCust:3,
    customers:[],
    custNextAt:[Date.now()+2000, Date.now()+4000, Date.now()+6000],  // 빠른 첫 등장
    dailyClaimed:0,
  };
}

function loadState(){
  try{
    const raw=localStorage.getItem(SAVE);
    if(raw){
      S=JSON.parse(raw);
      if(!S.board||S.board.length!==TOTAL)S.board=Array(TOTAL).fill(null);
      if(!S.unlocked)S.unlocked=Array.from({length:18},(_,i)=>i);
      if(!S.customers)S.customers=[];
      if(!S.custNextAt)S.custNextAt=[Date.now()+2000,Date.now()+4000,Date.now()+6000];
      if(!S.maxCust)S.maxCust=3;
      if(!S.unlockedTrails)S.unlockedTrails=['tomato'];
      if(!S.unlockedGens)S.unlockedGens=['tomato'];
      delete S._enStarted;
    }else S=defState();
  }catch{S=defState();}
  const gap=Date.now()-(S.energyLastAt||Date.now());
  const gain=Math.min(MAX_EN-S.energy,Math.floor(gap/REGEN_MS));
  if(gain>0){S.energy+=gain;S.energyLastAt+=(gain*REGEN_MS);}
}

let _svT;
function save(){clearTimeout(_svT);_svT=setTimeout(()=>localStorage.setItem(SAVE,JSON.stringify(S)),400);}

// ── HELPERS ───────────────────────────────────────────────────────
const getItem=(trail,stage)=>TRAILS[trail]?.items[stage-1];
const maxStg=(trail)=>TRAILS[trail]?.items.length??0;

let _tT;
function toast(msg,dur=2200){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.remove('hidden');
  clearTimeout(_tT);_tT=setTimeout(()=>el.classList.add('hidden'),dur);
}

function floatEl(x,y,txt,sz='1.4em'){
  const el=document.createElement('div');
  el.className='float-el';
  el.style.cssText=`left:${x}px;top:${y}px;font-size:${sz}`;
  el.textContent=txt;document.body.appendChild(el);
  setTimeout(()=>el.remove(),950);
}

function coinFly(fromRect,count){
  const to=document.getElementById('h-coin').getBoundingClientRect();
  const tx=(to.left+to.width/2)-(fromRect.left+fromRect.width/2);
  const ty=(to.top+to.height/2)-(fromRect.top+fromRect.height/2);
  for(let i=0;i<Math.min(count,3);i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='coin-el';
      el.style.cssText=`left:${fromRect.left+fromRect.width/2}px;top:${fromRect.top+fromRect.height/2}px;--tx:${tx}px;--ty:${ty}px`;
      el.textContent='🪙';document.body.appendChild(el);
      setTimeout(()=>el.remove(),650);
    },i*90);
  }
}

function showLvUp(lv,msg){
  const el=document.createElement('div');
  el.className='lvup-el';
  el.innerHTML=`<div class="text-center"><div class="text-5xl font-black text-yellow-400 drop-shadow-lg">LEVEL UP!</div><div class="text-2xl text-white font-bold mt-1">Lv.${lv}</div><div class="text-sm text-yellow-200 mt-2">${msg}</div></div>`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),2200);
}

function vib(...a){if(navigator.vibrate)navigator.vibrate(...a);}

// ── RENDER ────────────────────────────────────────────────────────
function renderHUD(){
  document.getElementById('h-coin').textContent='🪙 '+S.coins.toLocaleString();
  document.getElementById('h-gem').textContent='💎 '+(S.gems||0);
  document.getElementById('h-lv').textContent='⭐Lv.'+S.level;
  document.getElementById('h-en').textContent='⚡'+S.energy+'/'+MAX_EN;
  document.getElementById('en-bar').style.width=(S.energy/MAX_EN*100)+'%';
  if(S.energy<MAX_EN){
    const left=Math.ceil((REGEN_MS-(Date.now()-S.energyLastAt))/1000);
    document.getElementById('en-cd').textContent=left>0?left+'s':'';
  }else document.getElementById('en-cd').textContent='MAX';
  const base=LV_XP[S.level]||0,next=LV_XP[S.level+1];
  document.getElementById('xp-bar').style.width=(next?((S.xp-base)/(next-base)*100):100)+'%';
}

function renderGens(){
  const el=document.getElementById('gens');el.innerHTML='';
  TK.forEach(t=>{
    const g=TRAILS[t].gen,on=S.unlockedGens.includes(t);
    const d=document.createElement('div');
    d.className='gen-btn'+(on?'':' locked');
    d.innerHTML=`<div class="text-2xl">${g.icon}</div><div class="text-xs text-center leading-tight text-green-800">${g.name}</div><div class="text-xs text-amber-600 mt-0.5">⚡-1</div>`;
    if(!on)d.innerHTML+=`<div class="text-xs text-gray-400 mt-0.5">잠김</div>`;
    if(on)d.addEventListener('pointerdown',e=>{e.stopPropagation();tapGen(t,d);});
    el.appendChild(d);
  });
}

function renderBoard(){
  const bd=document.getElementById('board');bd.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const cell=document.createElement('div');
    cell.dataset.cell=i;
    const it=S.board[i],open=S.unlocked.includes(i);
    if(open){
      cell.className='cell open';
      if(it){
        const inf=getItem(it.trail,it.stage);
        cell.innerHTML=`<span class="pointer-events-none">${inf?.icon||'?'}</span>`;
        if(it.stage>1){
          const b=document.createElement('div');
          b.className='absolute bottom-0.5 right-0.5 text-xs bg-amber-600 text-white rounded-full w-4 h-4 flex items-center justify-center font-bold leading-none pointer-events-none';
          b.textContent=it.stage;cell.appendChild(b);
        }
      }
      cell.addEventListener('pointerdown',onPtrDown);
    }else{
      const cost=unlockCost(i);
      cell.className='cell locked text-center';
      cell.innerHTML=`<div class="pointer-events-none"><div>🔒</div><div class="text-gray-500" style="font-size:.65em">${cost}🪙</div></div>`;
      cell.addEventListener('pointerdown',()=>tryUnlock(i));
    }
    bd.appendChild(cell);
  }
  updateOrderHighlights();
}

// 손님 주문과 매칭되는 보드 아이템 하이라이트
function updateOrderHighlights(){
  document.querySelectorAll('.cell.ordered').forEach(c=>c.classList.remove('ordered'));
  S.customers.forEach(cust=>{
    for(let i=0;i<TOTAL;i++){
      const it=S.board[i];
      if(it&&it.trail===cust.trail&&it.stage===cust.stage){
        document.querySelector(`[data-cell="${i}"]`)?.classList.add('ordered');
      }
    }
  });
}

function renderCusts(){
  const el=document.getElementById('custs');el.innerHTML='';
  const now=Date.now();
  for(let s=0;s<S.maxCust;s++){
    const c=S.customers.find(x=>x.slot===s);
    const d=document.createElement('div');
    if(c){
      const inf=getItem(c.trail,c.stage);
      const pct=Math.max(0,c.patience/c.maxPatience*100);
      const pc=pct>60?'#10B981':pct>30?'#F59E0B':'#EF4444';
      d.className='cslot';d.dataset.cslot=s;
      d.innerHTML=
        `<div class="text-xl pointer-events-none">${c.emoji}</div>`+
        `<div class="text-xl pointer-events-none">${inf?.icon||'?'}</div>`+
        `<div class="text-xs text-center leading-tight text-amber-800 pointer-events-none" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">${inf?.name||''}</div>`+
        `<div class="pbar"><div class="pfill" style="width:${pct}%;background:${pc}"></div></div>`;
      if(pct<20)d.style.borderColor='#EF4444';
    }else{
      d.className='cslot empty';
      const wait=Math.max(0,Math.ceil(((S.custNextAt[s]||0)-now)/1000));
      d.innerHTML=
        `<div class="text-gray-400 text-xl">⏱</div>`+
        `<div class="text-xs text-gray-400" data-timer="${s}">${wait>0?wait+'s':''}</div>`;
    }
    el.appendChild(d);
  }
  updateOrderHighlights();
}

// 성능 최적화: 매 rAF마다 DOM 재생성 대신 인내심 바만 갱신
function tickCustUI(now){
  S.customers.forEach(c=>{
    const fill=document.querySelector(`[data-cslot="${c.slot}"] .pfill`);
    if(!fill)return;
    const pct=Math.max(0,c.patience/c.maxPatience*100);
    fill.style.width=pct+'%';
    fill.style.background=pct>60?'#10B981':pct>30?'#F59E0B':'#EF4444';
    const slot=document.querySelector(`[data-cslot="${c.slot}"]`);
    if(slot)slot.style.borderColor=pct<20?'#EF4444':'';
  });
  // 빈 슬롯 카운트다운 갱신
  for(let s=0;s<S.maxCust;s++){
    if(!S.customers.some(c=>c.slot===s)){
      const timerEl=document.querySelector(`[data-timer="${s}"]`);
      if(timerEl){
        const wait=Math.max(0,Math.ceil(((S.custNextAt[s]||0)-now)/1000));
        timerEl.textContent=wait>0?wait+'s':'';
      }
    }
  }
}

function renderAll(){renderHUD();renderGens();renderBoard();renderCusts();}

// ── DRAG & DROP (Pointer Events) ──────────────────────────────────
let DRG=null;
let PTR={x:0,y:0,t:0,idx:-1};
const DRAG_THR=8;

function onPtrDown(e){
  if(e.button!==0&&e.pointerType==='mouse')return;
  e.preventDefault();e.stopPropagation();
  const idx=parseInt(e.currentTarget.dataset.cell);
  if(!S.board[idx])return;
  PTR={x:e.clientX,y:e.clientY,t:Date.now(),idx};
  document.addEventListener('pointermove',onPtrMove,{passive:false});
  document.addEventListener('pointerup',onPtrUp);
  document.addEventListener('pointercancel',onPtrCancel);
}

function startDrag(idx,e){
  const it=S.board[idx];
  const inf=getItem(it.trail,it.stage);if(!inf)return;
  const ghost=document.createElement('div');
  ghost.className='ghost';ghost.textContent=inf.icon;
  ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
  document.body.appendChild(ghost);
  DRG={idx,ghost};
}

function onPtrMove(e){
  e.preventDefault();
  const moved=Math.hypot(e.clientX-PTR.x,e.clientY-PTR.y);
  if(!DRG&&moved>DRAG_THR)startDrag(PTR.idx,e);
  if(DRG){
    DRG.ghost.style.left=e.clientX+'px';DRG.ghost.style.top=e.clientY+'px';
    document.querySelectorAll('.drag-hi,.drop-hi').forEach(x=>x.classList.remove('drag-hi','drop-hi'));
    const el=document.elementFromPoint(e.clientX,e.clientY);
    el?.closest('[data-cell]')?.classList.add('drag-hi');
    el?.closest('[data-cslot]')?.classList.add('drop-hi');
  }
}

function onPtrUp(e){
  const moved=Math.hypot(e.clientX-PTR.x,e.clientY-PTR.y);
  const quick=Date.now()-PTR.t<280;

  if(moved<DRAG_THR&&quick&&PTR.idx>=0){
    // 탭(짧게 누름) → 아이템 메뉴
    onPtrCancel();
    showItemMenu(PTR.idx);
    return;
  }

  if(DRG){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const tCell=el?.closest('[data-cell]');
    const tCust=el?.closest('[data-cslot]');
    if(tCell){
      const ti=parseInt(tCell.dataset.cell);
      if(ti!==DRG.idx)doDrop(DRG.idx,ti);
    }else if(tCust){
      doServe(DRG.idx,parseInt(tCust.dataset.cslot),tCust);
    }
  }
  onPtrCancel();
}

function onPtrCancel(){
  DRG?.ghost?.remove();DRG=null;
  document.querySelectorAll('.drag-hi,.drop-hi').forEach(x=>x.classList.remove('drag-hi','drop-hi'));
  document.removeEventListener('pointermove',onPtrMove);
  document.removeEventListener('pointerup',onPtrUp);
  document.removeEventListener('pointercancel',onPtrCancel);
}

// ── 아이템 메뉴 (탭) ──────────────────────────────────────────────
function showItemMenu(cellIdx){
  const it=S.board[cellIdx];if(!it)return;
  const inf=getItem(it.trail,it.stage);if(!inf)return;
  const canServe=inf.patience>0;
  const sellPrice=it.stage<=1?1:Math.floor((inf.coins||0)*0.4);
  const statusMsg=canServe
    ? `<span class="text-green-600 font-bold">✅ 서빙 가능</span> · 보상 🪙${inf.coins}`
    : `<span class="text-gray-400">단계 올리면 서빙 가능 (지금은 합치기만 됩니다)</span>`;
  showModal(inf.icon+' '+inf.name,
    `<p class="text-sm text-center mb-1">단계 ${it.stage} / ${maxStg(it.trail)}</p>`+
    `<p class="text-sm text-center mb-4">${statusMsg}</p>`+
    `<button onclick="sellItem(${cellIdx})" class="w-full bg-red-100 text-red-600 py-2.5 rounded-xl font-bold">🗑️ 팔기 (🪙 ${sellPrice})</button>`+
    `<button onclick="closeModal()" class="mt-2 w-full bg-gray-100 py-2 rounded-xl text-gray-600">취소</button>`);
}

function sellItem(cellIdx){
  const it=S.board[cellIdx];
  if(!it){closeModal();return;}
  const inf=getItem(it.trail,it.stage);
  const sellPrice=it.stage<=1?1:Math.floor((inf?.coins||0)*0.4);
  S.board[cellIdx]=null;
  S.coins+=sellPrice;
  closeModal();renderBoard();renderHUD();save();
  toast('🗑️ 판매 +🪙'+sellPrice);
}

// ── MERGE ─────────────────────────────────────────────────────────
function doDrop(src,tgt){
  if(!S.unlocked.includes(tgt))return;
  const a=S.board[src],b=S.board[tgt];
  if(!b){
    S.board[tgt]=a;S.board[src]=null;
  }else if(a.trail===b.trail&&a.stage===b.stage&&a.stage<maxStg(a.trail)){
    S.board[tgt]={trail:a.trail,stage:a.stage+1};
    S.board[src]=null;
    vib([30,15,60]);
    setTimeout(()=>{
      const cel=document.querySelector(`[data-cell="${tgt}"]`);
      if(cel){
        cel.classList.add('anim-pop');
        const r=cel.getBoundingClientRect();
        for(let i=0;i<6;i++){
          const ang=(i/6)*Math.PI*2,d=28+Math.random()*16;
          floatEl(r.left+r.width/2+Math.cos(ang)*d,r.top+r.height/2+Math.sin(ang)*d,'✨','1em');
        }
        setTimeout(()=>cel.classList.remove('anim-pop'),300);
      }
    },10);
  }else{
    S.board[tgt]=a;S.board[src]=b;
  }
  renderBoard();save();
}

// ── SERVE ─────────────────────────────────────────────────────────
function doServe(cellIdx,slot,custEl){
  const it=S.board[cellIdx];if(!it)return;
  const c=S.customers.find(x=>x.slot===slot);if(!c)return;
  if(it.trail===c.trail&&it.stage===c.stage){
    const inf=getItem(c.trail,c.stage);
    const coins=inf?.coins||0;
    S.board[cellIdx]=null;
    S.coins+=coins;
    S.xp+=Math.floor(coins/2);
    checkLvUp();
    const r=custEl.getBoundingClientRect();
    floatEl(r.left+r.width/2,r.top,'💖','1.8em');
    coinFly(r,Math.ceil(coins/40));
    vib([40,20,80]);
    S.customers=S.customers.filter(x=>x.slot!==slot);
    S.custNextAt[slot]=Date.now()+5000+Math.random()*10000;
    renderBoard();renderCusts();renderHUD();save();
  }else{
    toast('주문과 다른 음식이에요! ❌');vib(40);
    const cel=document.querySelector(`[data-cell="${cellIdx}"]`);
    if(cel){cel.classList.add('do-shake');setTimeout(()=>cel.classList.remove('do-shake'),300);}
  }
}

// ── GENERATOR ─────────────────────────────────────────────────────
function tapGen(trail,btn){
  if(S.energy<=0){toast('⚡ 에너지가 없어요!');vib(30);return;}
  const empty=S.unlocked.filter(i=>!S.board[i]);
  if(!empty.length){toast('보드가 가득 찼어요! 🈵');return;}
  const wasFull=(S.energy===MAX_EN);
  S.energy--;
  if(wasFull)S.energyLastAt=Date.now();
  const ti=empty[Math.floor(Math.random()*empty.length)];
  S.board[ti]={trail,stage:1};
  vib(20);
  btn.classList.add('pressed');setTimeout(()=>btn.classList.remove('pressed'),120);
  setTimeout(()=>{
    const c=document.querySelector(`[data-cell="${ti}"]`);
    if(c){c.classList.add('anim-pop');setTimeout(()=>c.classList.remove('anim-pop'),300);}
  },50);
  renderBoard();renderHUD();save();
}

// ── CUSTOMERS ─────────────────────────────────────────────────────
function spawnCust(slot){
  const trails=S.unlockedTrails.filter(t=>TRAILS[t]);
  if(!trails.length)return;
  const trail=trails[Math.floor(Math.random()*trails.length)];
  const hi=Math.min(maxStg(trail),Math.ceil(S.level/2)+1),lo=Math.min(2,hi);
  const stage=lo+Math.floor(Math.random()*(hi-lo+1));
  const inf=getItem(trail,stage);
  if(!inf||!inf.patience)return;
  S.customers.push({slot,trail,stage,patience:inf.patience,maxPatience:inf.patience,
    emoji:CEMOJI[Math.floor(Math.random()*CEMOJI.length)],appearedAt:Date.now()});
}

let _lastTick=Date.now();
function updateCusts(now){
  let needRender=false;

  // 빈 슬롯에 손님 스폰
  for(let s=0;s<S.maxCust;s++){
    if(!S.customers.some(c=>c.slot===s)&&now>=(S.custNextAt[s]||0)){
      spawnCust(s);needRender=true;
    }
  }

  // 1초마다 인내심 감소
  if(now-_lastTick>=1000){
    _lastTick=now;
    for(let i=S.customers.length-1;i>=0;i--){
      const c=S.customers[i];
      c.patience--;
      if(c.patience<=0){
        const sl=c.slot;
        const cEl=document.querySelector(`[data-cslot="${sl}"]`);
        if(cEl){const r=cEl.getBoundingClientRect();floatEl(r.left+r.width/2,r.top,'💢','1.6em');}
        S.reputation=Math.max(0,S.reputation-1);
        if(S.reputation===0)toast('⚠️ 평판 0! 빨리 손님을 대접하세요!');
        S.customers.splice(i,1);
        S.custNextAt[sl]=now+10000+Math.random()*10000;
        vib([25,15,25,15,25]);
        needRender=true;
      }
    }
    if(!needRender)tickCustUI(now); // 전체 재렌더 없이 바만 갱신
    save();
  }

  if(needRender)renderCusts();
}

// ── LEVEL ─────────────────────────────────────────────────────────
function checkLvUp(){
  const max=LV_XP.length-1;
  while(S.level<max&&S.xp>=(LV_XP[S.level+1]||Infinity)){
    S.level++;
    const r=LV_REWARD[S.level];
    if(!r)continue;
    S.gems=(S.gems||0)+(r.gems||0);
    if(r.unlockExtra){
      let n=0;
      for(let i=0;i<TOTAL&&n<r.unlockExtra;i++){
        if(!S.unlocked.includes(i)){S.unlocked.push(i);n++;}
      }
    }
    if(r.gen&&!S.unlockedGens.includes(r.gen)){
      S.unlockedGens.push(r.gen);S.unlockedTrails.push(r.gen);
      renderGens();
    }
    if(r.maxCust){
      S.maxCust=r.maxCust;
      while(S.custNextAt.length<S.maxCust)S.custNextAt.push(Date.now()+5000);
    }
    showLvUp(S.level,r.msg);
  }
}

// ── CELL UNLOCK ───────────────────────────────────────────────────
function tryUnlock(idx){
  const cost=unlockCost(idx);
  if(S.coins<cost){toast(`🪙 ${cost} 코인 필요 (보유: ${S.coins})`);return;}
  showModal('🔓 셀 해금',
    `<p class="text-center mb-4">이 칸을 해금합니다<br><span class="text-amber-600 font-bold text-2xl">🪙 ${cost}</span></p>`+
    `<button onclick="doUnlock(${idx})" class="w-full bg-amber-500 text-white py-2.5 rounded-xl font-bold">해금하기</button>`+
    `<button onclick="closeModal()" class="mt-2 w-full bg-gray-100 py-2 rounded-xl text-gray-600">취소</button>`);
}
function doUnlock(idx){
  const cost=unlockCost(idx);
  if(S.coins>=cost){S.coins-=cost;S.unlocked.push(idx);closeModal();renderBoard();renderHUD();save();toast('🔓 셀 해금!');}
}

// ── SHOP ──────────────────────────────────────────────────────────
function openShop(){
  showModal('🛒 상점',
    `<div class="space-y-2 text-sm">`+
    `<div class="flex items-center justify-between bg-amber-50 p-3 rounded-xl"><div><b>⚡ 에너지 완전 충전</b><div class="text-xs text-gray-400">20으로 즉시 충전</div></div><button onclick="shop('en-full')" class="bg-blue-500 text-white px-3 py-1.5 rounded-lg font-bold">💎5</button></div>`+
    `<div class="flex items-center justify-between bg-amber-50 p-3 rounded-xl"><div><b>⚡ 에너지 +5</b><div class="text-xs text-gray-400">에너지 5 즉시 추가</div></div><button onclick="shop('en-5')" class="bg-cyan-500 text-white px-3 py-1.5 rounded-lg font-bold">💎2</button></div>`+
    `<div class="flex items-center justify-between bg-amber-50 p-3 rounded-xl"><div><b>💎 다이아 +10</b><div class="text-xs text-gray-400">코인으로 구매</div></div><button onclick="shop('gem-10')" class="bg-purple-500 text-white px-3 py-1.5 rounded-lg font-bold">🪙500</button></div>`+
    `<div class="flex items-center justify-between bg-amber-50 p-3 rounded-xl"><div><b>⏱ 인내심 +30초</b><div class="text-xs text-gray-400">전 손님에게 적용</div></div><button onclick="shop('pat')" class="bg-green-500 text-white px-3 py-1.5 rounded-lg font-bold">💎1</button></div>`+
    `</div><button onclick="closeModal()" class="mt-3 w-full bg-gray-100 py-2 rounded-xl text-gray-600">닫기</button>`);
}
function shop(type){
  const g=S.gems||0;
  if(type==='en-full'){if(g<5){toast('💎 부족!');return;}S.gems-=5;S.energy=MAX_EN;S.energyLastAt=Date.now();toast('⚡ 에너지 완충!');}
  else if(type==='en-5'){if(g<2){toast('💎 부족!');return;}S.gems-=2;S.energy=Math.min(MAX_EN,S.energy+5);toast('⚡ +5!');}
  else if(type==='gem-10'){if(S.coins<500){toast('🪙 부족!');return;}S.coins-=500;S.gems=(S.gems||0)+10;toast('💎 +10!');}
  else if(type==='pat'){if(g<1){toast('💎 부족!');return;}if(!S.customers.length){toast('손님 없음!');return;}S.gems-=1;S.customers.forEach(c=>c.patience=Math.min(c.maxPatience,c.patience+30));tickCustUI(Date.now());toast('⏱ +30초!');}
  closeModal();renderHUD();save();
}

// ── DEX ───────────────────────────────────────────────────────────
function openDex(){
  let h='<div class="grid grid-cols-3 gap-2">';
  S.unlockedTrails.forEach(t=>{
    TRAILS[t].items.forEach((it,i)=>{
      const canServe=it.patience>0;
      h+=`<div class="bg-amber-50 rounded-xl p-2 text-center ${canServe?'':'opacity-50'}"><div class="text-2xl">${it.icon}</div><div class="text-xs mt-0.5 text-amber-900 leading-tight">${it.name}</div><div class="text-xs text-amber-500">${it.coins?'🪙'+it.coins:'-'}</div></div>`;
    });
  });
  h+='</div><p class="text-xs text-gray-400 mt-2 text-center">흐린 아이템은 단계를 올려야 서빙 가능</p><button onclick="closeModal()" class="mt-3 w-full bg-gray-100 py-2 rounded-xl text-gray-600">닫기</button>';
  showModal('📖 도감',h);
}

// ── DAILY ─────────────────────────────────────────────────────────
function claimDaily(){
  const now=Date.now(),day=86400000;
  if(now-(S.dailyClaimed||0)<day){toast(`🎁 ${Math.ceil((day-(now-(S.dailyClaimed||0)))/3600000)}시간 후 수령 가능`);return;}
  S.coins+=200;S.gems=(S.gems||0)+3;S.energy=MAX_EN;S.energyLastAt=Date.now();S.dailyClaimed=now;
  renderHUD();save();
  showModal('🎁 일일 보너스!',
    `<div class="text-center py-2"><div class="text-5xl mb-3">🎁</div><div class="font-bold text-lg mb-3">보너스 수령!</div>`+
    `<div class="space-y-1"><div class="text-amber-600 font-bold">🪙 +200 코인</div><div class="text-blue-600 font-bold">💎 +3 다이아</div><div class="text-yellow-600 font-bold">⚡ 에너지 완충</div></div>`+
    `<button onclick="closeModal()" class="mt-4 w-full bg-amber-500 text-white py-2.5 rounded-xl font-bold">감사합니다!</button></div>`);
}

// ── SETTINGS ──────────────────────────────────────────────────────
function openSettings(){
  const rep='⭐'.repeat(Math.max(0,S.reputation))+'☆'.repeat(Math.max(0,5-S.reputation));
  showModal('⚙️ 설정',
    `<div class="space-y-3 text-sm">`+
    `<div class="bg-amber-50 p-3 rounded-xl text-center"><div class="text-gray-500 text-xs mb-1">평판</div><div class="text-xl">${rep}</div></div>`+
    `<div class="bg-amber-50 p-3 rounded-xl text-center text-xs text-gray-500">Lv.${S.level} · XP ${S.xp} · 셀 ${S.unlocked.length}/${TOTAL}개 해금</div>`+
    `<button onclick="confirmReset()" class="w-full bg-red-100 text-red-600 py-2 rounded-xl font-bold">🔄 게임 초기화</button>`+
    `</div><button onclick="closeModal()" class="mt-3 w-full bg-gray-100 py-2 rounded-xl text-gray-600">닫기</button>`);
}
function confirmReset(){
  if(confirm('게임 데이터를 초기화합니까?\n되돌릴 수 없습니다.')){
    localStorage.removeItem(SAVE);S=defState();closeModal();renderAll();toast('초기화 완료');
  }
}

// ── MODAL ─────────────────────────────────────────────────────────
function showModal(title,html){
  document.getElementById('modal-body').innerHTML=`<h2 class="text-lg font-bold mb-3 text-amber-800">${title}</h2>${html}`;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
document.getElementById('modal').addEventListener('pointerdown',e=>{if(e.target===e.currentTarget)closeModal();});

// ── GAME LOOP ─────────────────────────────────────────────────────
function tick(){
  const now=Date.now();
  if(S.energy<MAX_EN){
    const gap=now-S.energyLastAt;
    if(gap>=REGEN_MS){
      const gain=Math.min(MAX_EN-S.energy,Math.floor(gap/REGEN_MS));
      S.energy=Math.min(MAX_EN,S.energy+gain);
      S.energyLastAt+=gain*REGEN_MS;
      save();
    }
  }
  updateCusts(now);
  renderHUD();
  requestAnimationFrame(tick);
}

// ── INIT ──────────────────────────────────────────────────────────
loadState();
renderAll();
requestAnimationFrame(tick);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
