<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="마을머지">
<meta name="theme-color" content="#1B5E20">
<link rel="manifest" href="manifest.json">
<title>마을 머지</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  background:linear-gradient(170deg,#42A5F5 0%,#66BB6A 50%,#2E7D32 100%);
  display:flex;flex-direction:column;align-items:center;
  height:100vh;height:100dvh;
}

/* ── HUD ── */
#hud{
  width:100%;max-width:460px;flex-shrink:0;
  display:flex;justify-content:space-around;align-items:center;
  padding:10px 10px 6px;gap:6px;
}
.hc{
  background:rgba(0,0,0,0.35);backdrop-filter:blur(10px);
  border-radius:20px;padding:7px 14px;
  display:flex;align-items:center;gap:5px;
  color:#fff;font-weight:700;font-size:14px;
  flex:1;justify-content:center;min-width:0;
}
.hc .val{font-size:15px}

/* ── QUEST BAR ── */
#quest-bar{
  width:100%;max-width:460px;flex-shrink:0;
  padding:0 10px 6px;
}
.qb-inner{
  background:rgba(0,0,0,0.28);backdrop-filter:blur(8px);
  border-radius:14px;padding:8px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:1px solid rgba(255,255,255,0.15);
}
.q-icon{font-size:16px;flex-shrink:0}
.q-text{color:#FFF9C4;font-size:12px;font-weight:600;flex:1;line-height:1.3}
.q-reward{color:#FFD700;font-size:11px;font-weight:700;flex-shrink:0}
#q-claim{
  background:linear-gradient(135deg,#FFD700,#FF8C00);
  border:none;border-radius:10px;padding:5px 10px;
  color:#fff;font-size:12px;font-weight:800;cursor:pointer;
  box-shadow:0 2px 8px rgba(255,140,0,0.5);flex-shrink:0;
  display:none;
}

/* ── GRID WRAP ── */
#grid-wrap{
  width:100%;max-width:460px;flex:1;
  display:flex;align-items:center;justify-content:center;
  padding:4px 10px;min-height:0;
}
#grid{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:5px;padding:10px;
  background:rgba(80,45,15,0.7);
  border-radius:20px;
  border:3px solid #6D3B1A;
  box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.1);
  width:100%;
}

/* ── CELL ── */
.cell{
  aspect-ratio:1;background:rgba(255,255,255,0.12);
  border-radius:11px;display:flex;align-items:center;justify-content:center;
  position:relative;border:1.5px solid rgba(255,255,255,0.08);
  transition:border-color .12s,background .12s;overflow:hidden;
}
.cell.filled{background:rgba(255,255,255,0.2)}
.cell.hl-merge{
  border-color:#FFD700!important;
  background:rgba(255,215,0,.3)!important;
  box-shadow:0 0 14px rgba(255,215,0,.7)!important;
}
.cell.hl-move{border-color:#A5D6A7!important;background:rgba(165,214,167,.2)!important}
.cell.drag-src{opacity:.3}

/* ── ITEM ── */
.item{
  width:92%;height:92%;border-radius:9px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;
  background:rgba(255,255,255,0.08);
}
.item .emo{font-size:1.85em;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.item .nm{
  font-size:8px;font-weight:700;color:rgba(255,255,255,.85);
  margin-top:2px;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.8);
}
.item .lv{
  position:absolute;bottom:2px;right:3px;
  font-size:9px;font-weight:800;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.9);
  background:rgba(0,0,0,.5);border-radius:4px;padding:1px 3px;
}
.gen-item{background:rgba(27,94,32,.4)!important;border:1.5px solid rgba(100,200,80,.5)!important;border-radius:9px}

/* pop + shine animation */
@keyframes popAnim{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.pop .item{animation:popAnim .35s cubic-bezier(.36,.07,.19,.97)}

@keyframes shineAnim{0%{left:-100%}100%{left:200%}}
.item::after{
  content:'';position:absolute;top:0;left:-100%;
  width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  transform:skewX(-20deg);pointer-events:none;
}
.item.shining::after{animation:shineAnim .5s ease}

/* particle */
@keyframes ptcl{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
.ptcl{position:fixed;border-radius:50%;pointer-events:none;z-index:600;animation:ptcl .7s ease forwards}

/* ── BOTTOM ── */
#bottom{
  width:100%;max-width:460px;flex-shrink:0;
  padding:4px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;
}
#e-row{display:flex;align-items:center;gap:5px;flex-wrap:nowrap}
.e-label{font-size:11px;color:rgba(255,255,255,.8);font-weight:700;white-space:nowrap}
.e-pip{
  width:18px;height:18px;border-radius:50%;
  background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.28);
  transition:background .25s,border-color .25s,transform .1s;flex-shrink:0;
}
.e-pip.on{
  background:linear-gradient(135deg,#FFE066,#FFB300);
  border-color:#FF8F00;
  box-shadow:0 0 5px rgba(255,180,0,.7);
  transform:scale(1.08);
}
#e-timer{font-size:11px;color:rgba(255,255,255,.7);font-weight:700;margin-left:2px;white-space:nowrap}
#btn-row{display:flex;gap:8px;width:100%}
.btn{
  flex:1;padding:11px 0;border:none;border-radius:24px;
  font-size:14px;font-weight:800;color:#fff;cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.25);letter-spacing:-.3px;
}
#btn-shop{background:linear-gradient(135deg,#FF8C00,#FFD700)}
#btn-sell{background:linear-gradient(135deg,#C0392B,#E74C3C)}
#btn-sell.active{background:linear-gradient(135deg,#1B5E20,#27AE60)}

/* ── GHOST ── */
#ghost{
  position:fixed;pointer-events:none;z-index:500;
  width:60px;height:60px;border-radius:12px;
  align-items:center;justify-content:center;
  font-size:2em;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));
  transform:scale(1.25);display:none;
}

/* ── SHOP OVERLAY ── */
#shop-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:800;display:flex;align-items:flex-end;justify-content:center;
}
#shop-overlay.hidden{display:none!important}
.sheet{
  width:100%;max-width:460px;background:#FFFBF2;
  border-radius:24px 24px 0 0;padding:20px 14px 30px;
  max-height:75vh;overflow-y:auto;
}
.sheet-hd{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.sheet-title{font-size:18px;font-weight:900;color:#333}
.sheet-coins{font-size:14px;font-weight:700;color:#E67E22}
.si{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:11px 14px;margin-bottom:8px;
  border-radius:14px;border:2px solid #EAE0D0;background:#fff;
  cursor:pointer;text-align:left;
}
.si:active{background:#FAF3E8}
.si-emo{font-size:22px;flex-shrink:0}
.si-info{flex:1;display:flex;flex-direction:column;gap:2px}
.si-name{font-size:14px;font-weight:800;color:#333}
.si-desc{font-size:11px;color:#888}
.si-price{font-weight:800;color:#E67E22;white-space:nowrap;font-size:14px}
.sheet-close{
  width:100%;padding:12px;border:none;border-radius:14px;
  background:#E0D5C8;font-size:16px;font-weight:700;cursor:pointer;
  margin-top:6px;color:#666;
}

/* ── NEW BUILDING POPUP ── */
#new-bldg{
  position:fixed;inset:0;z-index:900;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);
}
#new-bldg.hidden{display:none!important}
@keyframes popupIn{0%{transform:scale(.5) translateY(40px);opacity:0}70%{transform:scale(1.06) translateY(-5px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
.nb-card{
  background:linear-gradient(145deg,#FFFDE7,#FFF9C4);
  border-radius:28px;padding:30px 24px;
  text-align:center;max-width:260px;width:85%;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:popupIn .45s cubic-bezier(.34,1.56,.64,1) forwards;
  border:3px solid #FFD700;
}
.nb-tag{
  background:linear-gradient(135deg,#FF8C00,#FFD700);
  color:#fff;font-size:11px;font-weight:900;
  border-radius:20px;padding:4px 14px;display:inline-block;
  margin-bottom:12px;letter-spacing:.5px;
}
.nb-emo{font-size:72px;line-height:1;margin:4px 0 8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.nb-name{font-size:22px;font-weight:900;color:#333;margin-bottom:4px}
.nb-lv{font-size:13px;color:#888;margin-bottom:18px}
.nb-btn{
  background:linear-gradient(135deg,#FFD700,#FF8C00);
  border:none;border-radius:20px;padding:12px 32px;
  color:#fff;font-size:16px;font-weight:900;cursor:pointer;
  box-shadow:0 4px 15px rgba(255,140,0,.5);width:100%;
}

/* ── DAILY BONUS ── */
#daily-overlay{
  position:fixed;inset:0;z-index:900;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);
}
#daily-overlay.hidden{display:none!important}
.daily-card{
  background:linear-gradient(145deg,#E8F5E9,#C8E6C9);
  border-radius:28px;padding:28px 24px;
  text-align:center;max-width:260px;width:85%;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:popupIn .45s cubic-bezier(.34,1.56,.64,1) forwards;
  border:3px solid #4CAF50;
}
.daily-title{font-size:18px;font-weight:900;color:#1B5E20;margin-bottom:8px}
.daily-sub{font-size:13px;color:#388E3C;margin-bottom:16px}
.daily-reward{font-size:28px;font-weight:900;color:#E65100;margin-bottom:16px}
.daily-btn{
  background:linear-gradient(135deg,#4CAF50,#2E7D32);
  border:none;border-radius:20px;padding:12px 32px;
  color:#fff;font-size:16px;font-weight:900;cursor:pointer;
  box-shadow:0 4px 15px rgba(46,125,50,.4);width:100%;
}

/* ── COMBO ── */
@keyframes comboIn{0%{transform:translateX(-50%) scale(.5);opacity:0}60%{transform:translateX(-50%) scale(1.15);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes comboOut{to{transform:translateX(-50%) scale(.8) translateY(-20px);opacity:0}}
#combo-pop{
  position:fixed;top:100px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#FF6B35,#FFD700);
  color:#fff;font-size:16px;font-weight:900;
  border-radius:30px;padding:8px 22px;
  box-shadow:0 4px 20px rgba(255,107,53,.6);
  z-index:700;pointer-events:none;white-space:nowrap;
  display:none;letter-spacing:.5px;
}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
  background:rgba(20,20,20,.88);color:#fff;
  padding:10px 20px;border-radius:24px;font-size:13px;
  z-index:950;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .25s;max-width:88%;text-align:center;
}
#toast.show{opacity:1}

/* ── FLOAT REWARD ── */
.flt{
  position:fixed;pointer-events:none;
  font-size:17px;font-weight:900;
  text-shadow:0 2px 4px rgba(0,0,0,.7);z-index:600;
  animation:flyUp .85s ease forwards;
}
@keyframes flyUp{
  0%  {opacity:1;transform:translateY(0) scale(1)}
  55% {opacity:1;transform:translateY(-36px) scale(1.2)}
  100%{opacity:0;transform:translateY(-62px) scale(.9)}
}

.hidden{display:none!important}
</style>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div class="hc">🪙 <span class="val" id="v-coins">0</span></div>
  <div class="hc">⚡ <span class="val" id="v-e">20</span><span style="opacity:.6;font-size:12px">/20</span></div>
  <div class="hc">🏆 <span class="val">Lv.</span><span class="val" id="v-maxlv">1</span></div>
</div>

<!-- Quest Bar -->
<div id="quest-bar">
  <div class="qb-inner">
    <span class="q-icon">🎯</span>
    <span class="q-text" id="q-text">오두막을 만들어보세요!</span>
    <span class="q-reward" id="q-reward">+30🪙</span>
    <button id="q-claim" onclick="claimQuest()">받기!</button>
  </div>
</div>

<!-- Grid -->
<div id="grid-wrap"><div id="grid"></div></div>

<!-- Bottom -->
<div id="bottom">
  <div id="e-row">
    <span class="e-label">⚡에너지</span>
    <span id="e-timer"></span>
  </div>
  <div id="btn-row">
    <button class="btn" id="btn-shop" onclick="openShop()">🏪 상점</button>
    <button class="btn" id="btn-sell" onclick="toggleSell()">💰 판매</button>
  </div>
</div>

<!-- Ghost -->
<div id="ghost"></div>

<!-- Shop -->
<div id="shop-overlay" class="hidden" onclick="overlayBg(event)">
  <div class="sheet">
    <div class="sheet-hd">
      <span class="sheet-title">🏪 상점</span>
      <span class="sheet-coins">보유: <span id="shop-coins">0</span>🪙</span>
    </div>
    <div id="shop-list"></div>
    <button class="sheet-close" onclick="closeShop()">닫기</button>
  </div>
</div>

<!-- New Building Popup -->
<div id="new-bldg" class="hidden">
  <div class="nb-card">
    <div class="nb-tag">✨ 새 건물 발견!</div>
    <div class="nb-emo" id="nb-emo">🏠</div>
    <div class="nb-name" id="nb-name">작은집</div>
    <div class="nb-lv" id="nb-lv">레벨 3</div>
    <button class="nb-btn" onclick="closeNewBldg()">멋져요!</button>
  </div>
</div>

<!-- Daily Bonus -->
<div id="daily-overlay" class="hidden">
  <div class="daily-card">
    <div class="daily-title">🌅 일일 보너스!</div>
    <div class="daily-sub">오늘도 마을 건설 화이팅!</div>
    <div class="daily-reward" id="daily-reward">+200🪙 +10⚡</div>
    <button class="daily-btn" onclick="claimDaily()">받기!</button>
  </div>
</div>

<!-- Combo popup -->
<div id="combo-pop">🔥 COMBO!</div>

<!-- Toast -->
<div id="toast"></div>

<script>
'use strict';

// ═══════════════ DATA ═══════════════
const BLDGS = [
  {lv:1,  name:'텐트',        e:'🏕️',  bg:'#C8A46A',  gc:'#D4B07A,#C08050', c:3    },
  {lv:2,  name:'오두막',      e:'🛖',   bg:'#9A6040',  gc:'#B07850,#8A5030', c:8    },
  {lv:3,  name:'작은집',      e:'🏠',   bg:'#4A94CF',  gc:'#60A8E0,#3880B8', c:20   },
  {lv:4,  name:'잔디집',      e:'🏡',   bg:'#52A85C',  gc:'#6ABE74,#3D8E48', c:45   },
  {lv:5,  name:'타운하우스',  e:'🏘️',  bg:'#E87030',  gc:'#F08C48,#D05818', c:95   },
  {lv:6,  name:'공사중',      e:'🏗️',  bg:'#D4B020',  gc:'#EAC830,#BCA010', c:200  },
  {lv:7,  name:'오피스',      e:'🏢',   bg:'#4878C0',  gc:'#608CD4,#3060A8', c:420  },
  {lv:8,  name:'상업빌딩',    e:'🏬',   bg:'#7050C8',  gc:'#8868DC,#5838B0', c:860  },
  {lv:9,  name:'고층빌딩',    e:'🏙️',  bg:'#2898C0',  gc:'#40ACDC,#1880A8', c:1750 },
  {lv:10, name:'성',          e:'🏰',   bg:'#C03030',  gc:'#D84848,#A01818', c:3500 },
  {lv:11, name:'타워',        e:'🗼',   bg:'#C07018',  gc:'#D88830,#A85800', c:7000 },
  {lv:12, name:'왕국',        e:'👑',   bg:'#B09010',  gc:'#D0B030,#907800', c:14000},
];
const MAX_LV = BLDGS.length;
const COLS = 5, ROWS = 7, SIZE = COLS * ROWS;
const REGEN_MS  = 30_000;  // 30초
const MAX_ENERGY = 20;

const QUESTS = [
  {lv:2,  desc:'오두막을 만들어보세요',     rc:30,   re:0 },
  {lv:3,  desc:'작은집을 만들어보세요',     rc:60,   re:0 },
  {lv:4,  desc:'잔디집을 만들어보세요',     rc:120,  re:5 },
  {lv:5,  desc:'타운하우스를 완성하세요',   rc:250,  re:5 },
  {lv:6,  desc:'공사중 건물을 달성하세요',  rc:500,  re:8 },
  {lv:7,  desc:'오피스를 건설하세요',       rc:1000, re:10},
  {lv:8,  desc:'상업빌딩을 완성하세요',     rc:2000, re:10},
  {lv:9,  desc:'고층빌딩을 지어보세요',     rc:4000, re:15},
  {lv:10, desc:'성을 건설하세요',           rc:8000, re:15},
  {lv:11, desc:'타워를 완성하세요',         rc:15000,re:20},
  {lv:12, desc:'왕국을 완성하세요! 🎉',     rc:30000,re:30},
];

const SHOP_ITEMS = [
  {emo:'🏕️',name:'텐트',       desc:'레벨1 건물',      price:15,  act:'item',lv:1},
  {emo:'🛖', name:'오두막',     desc:'레벨2 건물',      price:40,  act:'item',lv:2},
  {emo:'🏠', name:'작은집',     desc:'레벨3 건물',      price:100, act:'item',lv:3},
  {emo:'🎁', name:'미스터리 상자',desc:'Lv1~4 랜덤 건물', price:60, act:'box' },
  {emo:'🌳', name:'나무 추가',   desc:'생성기 하나 더',  price:80,  act:'gen' },
  {emo:'⚡', name:'에너지 +10', desc:'즉시 10 충전',    price:80,  act:'energy',val:10},
];

// ═══════════════ STATE ═══════════════
let S = {
  grid: Array(SIZE).fill(null),
  coins: 100,
  energy: MAX_ENERGY,
  maxLv: 1,
  lastEnergy: Date.now(),
  discovered: [],
  questIdx: 0,
  questReady: false,
  lastDaily: null,
  sell: false,
};

let comboTimes = [];   // recent merge timestamps (runtime only)
let cellSize   = 60;   // computed cell size (px)

// ═══════════════ SAVE / LOAD ═══════════════
function save(){
  localStorage.setItem('mt4', JSON.stringify({
    grid:S.grid, coins:S.coins, energy:S.energy,
    maxLv:S.maxLv, lastEnergy:S.lastEnergy,
    discovered:S.discovered, questIdx:S.questIdx,
    questReady:S.questReady, lastDaily:S.lastDaily,
  }));
}
function load(){
  try{
    const raw = localStorage.getItem('mt4');
    if(!raw) return initNew();
    const d = JSON.parse(raw);
    S.grid       = d.grid ?? Array(SIZE).fill(null);
    S.coins      = d.coins  ?? 100;
    S.energy     = d.energy ?? MAX_ENERGY;
    S.maxLv      = d.maxLv  ?? 1;
    S.lastEnergy = d.lastEnergy ?? Date.now();
    S.discovered = d.discovered ?? [];
    S.questIdx   = d.questIdx   ?? 0;
    S.questReady = d.questReady ?? false;
    S.lastDaily  = d.lastDaily  ?? null;
    // Offline regen
    const gained = Math.floor((Date.now()-S.lastEnergy)/REGEN_MS);
    if(gained>0){
      S.energy = Math.min(MAX_ENERGY, S.energy+gained);
      S.lastEnergy = Date.now();
    }
  }catch(e){ initNew(); }
}
function initNew(){
  S.grid = Array(SIZE).fill(null);
  // 3 generators, 6 level-1 items
  const genPositions = [0, 5, 10];
  const itemPositions = [2, 3, 7, 8, 12, 13];
  genPositions.forEach(i => S.grid[i] = {gen:true});
  itemPositions.forEach(i => S.grid[i] = {lv:1});
  S.coins=100; S.energy=MAX_ENERGY; S.maxLv=1;
  S.discovered=[1]; S.questIdx=0; S.questReady=false;
  S.lastEnergy=Date.now(); S.lastDaily=null;
}

// ═══════════════ RESIZE ═══════════════
function computeSize(){
  const vw = Math.min(window.innerWidth, 460);
  const vh = window.innerHeight;
  const hudH   = document.getElementById('hud').offsetHeight   || 52;
  const questH = document.getElementById('quest-bar').offsetHeight || 44;
  const botH   = document.getElementById('bottom').offsetHeight  || 86;
  const availH = vh - hudH - questH - botH - 18;
  const availW = vw - 20;
  const byH = (availH - (ROWS-1)*5 - 20) / ROWS;
  const byW = (availW - (COLS-1)*5 - 20) / COLS;
  cellSize = Math.floor(Math.min(byH, byW, 74));
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(5,${cellSize}px)`;
}

// ═══════════════ RENDER ═══════════════
function render(){ renderGrid(); renderHUD(); renderEnergy(); renderQuest(); }

function renderGrid(){
  const G = document.getElementById('grid');
  if(G.children.length !== SIZE){
    G.innerHTML='';
    for(let i=0;i<SIZE;i++){
      const c=document.createElement('div');
      c.className='cell'; c.dataset.idx=i;
      G.appendChild(c);
    }
    bindGrid();
  }
  for(let i=0;i<SIZE;i++){
    const cell=G.children[i];
    const item=S.grid[i];
    cell.innerHTML='';
    cell.className='cell'+(item?' filled':'');
    if(!item) continue;
    const card=document.createElement('div');
    card.className='item'+(item.gen?' gen-item':'');
    if(!item.gen){
      const b=BLDGS[item.lv-1];
      card.style.background=`linear-gradient(135deg,${b.gc})`;
      card.style.boxShadow=`0 2px 8px ${b.bg}88`;
    }
    const emo=document.createElement('span');
    emo.className='emo';
    emo.textContent=item.gen?'🌳':BLDGS[item.lv-1].e;
    card.appendChild(emo);
    if(!item.gen){
      const nm=document.createElement('span');
      nm.className='nm'; nm.textContent=BLDGS[item.lv-1].name;
      card.appendChild(nm);
      const lv=document.createElement('span');
      lv.className='lv'; lv.textContent=item.lv;
      card.appendChild(lv);
    }
    cell.appendChild(card);
  }
}

function renderHUD(){
  document.getElementById('v-coins').textContent = S.coins.toLocaleString();
  document.getElementById('v-maxlv').textContent = S.maxLv;
  document.getElementById('v-e').textContent = S.energy;
}

function renderEnergy(){
  const row = document.getElementById('e-row');
  // Remove pips
  row.querySelectorAll('.e-pip').forEach(p=>p.remove());
  // Add 20 pips (in groups of 5 visually)
  const label = row.querySelector('.e-label');
  for(let i=0;i<MAX_ENERGY;i++){
    const p=document.createElement('div');
    p.className='e-pip'+(i<S.energy?' on':'');
    row.insertBefore(p, document.getElementById('e-timer'));
  }
  const el=document.getElementById('e-timer');
  if(S.energy>=MAX_ENERGY){ el.textContent=''; return; }
  const rem=Math.max(0,REGEN_MS-(Date.now()-S.lastEnergy)%REGEN_MS);
  const s=Math.ceil(rem/1000);
  el.textContent=`(${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')})`;
}

function renderQuest(){
  if(S.questIdx >= QUESTS.length){
    document.getElementById('q-text').textContent='👑 모든 퀘스트 완료!';
    document.getElementById('q-reward').textContent='';
    document.getElementById('q-claim').style.display='none';
    return;
  }
  const q=QUESTS[S.questIdx];
  document.getElementById('q-text').textContent=q.desc;
  let rstr = '+'+q.rc.toLocaleString()+'🪙';
  if(q.re>0) rstr += ' +'+q.re+'⚡';
  document.getElementById('q-reward').textContent=rstr;
  const btn=document.getElementById('q-claim');
  if(S.questReady){
    btn.style.display='block';
    document.getElementById('q-reward').style.display='none';
  } else {
    btn.style.display='none';
    document.getElementById('q-reward').style.display='';
  }
}

// ═══════════════ DRAG ═══════════════
let drag={on:false,from:-1,over:-1};

function bindGrid(){
  const G=document.getElementById('grid');
  G.addEventListener('touchstart',onTS,{passive:false});
  G.addEventListener('touchmove', onTM,{passive:false});
  G.addEventListener('touchend',  onTE);
  G.addEventListener('touchcancel',onTE);
  // Also support mouse for desktop testing
  G.addEventListener('mousedown', onMS);
}

function cellAt(x,y){
  const el=document.elementFromPoint(x,y);
  if(!el) return -1;
  const c=el.closest?.('.cell');
  return c ? +c.dataset.idx : -1;
}

function startDrag(idx,x,y){
  if(!S.grid[idx]) return;
  const item=S.grid[idx];
  if(S.sell){ sellItem(idx); return; }
  if(item.gen){ tapGen(idx); return; }
  drag.on=true; drag.from=idx; drag.over=-1;
  const g=document.getElementById('ghost');
  const b=BLDGS[item.lv-1];
  g.textContent=b.e;
  g.style.background=`linear-gradient(135deg,${b.gc})`;
  g.style.display='flex';
  g.style.left=(x-30)+'px'; g.style.top=(y-60)+'px';
  document.querySelector(`[data-idx="${idx}"]`)?.classList.add('drag-src');
}
function moveDrag(x,y){
  if(!drag.on) return;
  const g=document.getElementById('ghost');
  g.style.left=(x-30)+'px'; g.style.top=(y-60)+'px';
  const ov=cellAt(x,y);
  if(ov===drag.over) return;
  if(drag.over>=0) document.querySelector(`[data-idx="${drag.over}"]`)?.classList.remove('hl-merge','hl-move');
  drag.over=ov;
  if(ov>=0&&ov!==drag.from){
    const to=S.grid[ov], fr=S.grid[drag.from];
    const c=document.querySelector(`[data-idx="${ov}"]`);
    if(c){
      if(!to) c.classList.add('hl-move');
      else if(!to.gen&&!fr.gen&&to.lv===fr.lv) c.classList.add('hl-merge');
    }
  }
}
function endDrag(x,y){
  if(!drag.on) return;
  const to=cellAt(x,y);
  document.getElementById('ghost').style.display='none';
  document.querySelectorAll('.drag-src,.hl-merge,.hl-move')
    .forEach(c=>c.classList.remove('drag-src','hl-merge','hl-move'));
  drag.on=false;
  if(to<0||to===drag.from) return;
  doMove(drag.from, to);
}

// Touch
function onTS(e){
  e.preventDefault();
  if(e.touches.length!==1) return;
  const t=e.touches[0];
  startDrag(cellAt(t.clientX,t.clientY),t.clientX,t.clientY);
}
function onTM(e){ e.preventDefault(); if(e.touches.length!==1) return; const t=e.touches[0]; moveDrag(t.clientX,t.clientY); }
function onTE(e){ const t=e.changedTouches[0]; endDrag(t.clientX,t.clientY); }

// Mouse (for desktop testing)
function onMS(e){
  startDrag(cellAt(e.clientX,e.clientY),e.clientX,e.clientY);
  const mm=(ev)=>moveDrag(ev.clientX,ev.clientY);
  const mu=(ev)=>{ endDrag(ev.clientX,ev.clientY); document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); };
  document.addEventListener('mousemove',mm);
  document.addEventListener('mouseup',mu);
}

// ═══════════════ MOVE / MERGE ═══════════════
function doMove(from, to){
  const fr=S.grid[from], toItem=S.grid[to];
  if(!fr||fr.gen) return;
  if(!toItem){
    S.grid[to]=fr; S.grid[from]=null;
    render(); save(); return;
  }
  if(toItem.gen) return;
  if(fr.lv!==toItem.lv) return;
  if(fr.lv>=MAX_LV){ toast('👑 이미 최고 레벨이에요!'); return; }
  const nlv=fr.lv+1;
  // Combo calc
  const now=Date.now();
  comboTimes.push(now);
  comboTimes=comboTimes.filter(t=>now-t<5000);
  let mult=1, comboMsg='';
  if(comboTimes.length>=5){ mult=2;   comboMsg='🔥🔥 SUPER COMBO! x2'; }
  else if(comboTimes.length>=3){ mult=1.5; comboMsg='🔥 COMBO! x1.5'; }
  const base=BLDGS[nlv-1].c;
  const earned=Math.round(base*mult);
  S.grid[from]=null;
  S.grid[to]={lv:nlv};
  S.coins+=earned;
  if(nlv>S.maxLv){
    S.maxLv=nlv;
    checkQuestProgress(nlv);
    if(!S.discovered.includes(nlv)){
      S.discovered.push(nlv);
      setTimeout(()=>showNewBldg(nlv), 300);
    }
  }
  floatReward('+'+(mult>1?earned+'⭐':earned+'🪙'), to, mult>1?'#FFD700':'#FFF9C4');
  spawnParticles(to, BLDGS[nlv-1].bg);
  popCell(to);
  if(comboMsg) showCombo(comboMsg);
  render(); save();
}

// ═══════════════ GENERATOR ═══════════════
function tapGen(idx){
  if(S.energy<=0){ toast('⚡ 에너지가 없어요! 잠시 기다려주세요.'); return; }
  const empty=firstEmpty();
  if(empty<0){ toast('❗ 빈 칸이 없어요! 건물을 합쳐주세요.'); return; }
  S.energy--;
  S.grid[empty]={lv:1};
  popCell(idx);
  render(); save();
}
function firstEmpty(){ for(let i=0;i<SIZE;i++) if(!S.grid[i]) return i; return -1; }

// ═══════════════ SELL ═══════════════
function toggleSell(){
  S.sell=!S.sell;
  const b=document.getElementById('btn-sell');
  if(S.sell){
    b.textContent='✅ 판매 취소'; b.classList.add('active');
    toast('팔고 싶은 건물을 탭하세요 (코인 40% 환급)');
  } else {
    b.textContent='💰 판매'; b.classList.remove('active');
  }
}
function sellItem(idx){
  const item=S.grid[idx];
  if(!item||item.gen){ toast('나무는 판매할 수 없어요'); return; }
  const price=Math.floor(BLDGS[item.lv-1].c*0.4);
  S.grid[idx]=null;
  S.coins+=price;
  toast(`${BLDGS[item.lv-1].name} 판매 → +${price}🪙`);
  S.sell=false;
  const b=document.getElementById('btn-sell');
  b.textContent='💰 판매'; b.classList.remove('active');
  render(); save();
}

// ═══════════════ SHOP ═══════════════
function openShop(){
  const list=document.getElementById('shop-list');
  document.getElementById('shop-coins').textContent=S.coins.toLocaleString();
  list.innerHTML='';
  SHOP_ITEMS.forEach(it=>{
    const b=document.createElement('button');
    b.className='si';
    b.innerHTML=`
      <span class="si-emo">${it.emo}</span>
      <span class="si-info"><span class="si-name">${it.name}</span><span class="si-desc">${it.desc}</span></span>
      <span class="si-price">${it.price}🪙</span>`;
    b.addEventListener('click',()=>doBuy(it));
    list.appendChild(b);
  });
  document.getElementById('shop-overlay').classList.remove('hidden');
}
function closeShop(){ document.getElementById('shop-overlay').classList.add('hidden'); }
function overlayBg(e){ if(e.target===document.getElementById('shop-overlay')) closeShop(); }
function doBuy(it){
  if(S.coins<it.price){ toast('🪙 코인이 부족해요!'); return; }
  if(it.act==='energy'){
    S.coins-=it.price;
    S.energy=Math.min(MAX_ENERGY,S.energy+it.val);
    toast(`⚡ 에너지 +${it.val} 충전!`);
    closeShop(); render(); save(); return;
  }
  const empty=firstEmpty();
  if(empty<0){ toast('❗ 빈 칸이 없어요!'); return; }
  S.coins-=it.price;
  if(it.act==='gen')  S.grid[empty]={gen:true};
  else if(it.act==='item') S.grid[empty]={lv:it.lv};
  else if(it.act==='box'){
    const lv=Math.ceil(Math.random()*4);
    S.grid[empty]={lv};
    toast(`🎁 ${BLDGS[lv-1].name} 획득!`);
  }
  closeShop(); render(); save();
  document.getElementById('shop-coins').textContent=S.coins.toLocaleString();
}

// ═══════════════ QUESTS ═══════════════
function checkQuestProgress(newLv){
  if(S.questIdx>=QUESTS.length) return;
  const q=QUESTS[S.questIdx];
  if(newLv>=q.lv && !S.questReady){
    S.questReady=true;
    toast('🎯 퀘스트 달성! 보상을 받으세요!');
    renderQuest();
  }
}
function claimQuest(){
  if(!S.questReady||S.questIdx>=QUESTS.length) return;
  const q=QUESTS[S.questIdx];
  S.coins+=q.rc;
  S.energy=Math.min(MAX_ENERGY,S.energy+q.re);
  S.questReady=false;
  S.questIdx++;
  let msg=`🎉 +${q.rc.toLocaleString()}🪙`;
  if(q.re>0) msg+=` +${q.re}⚡`;
  toast(msg);
  render(); save();
}

// ═══════════════ DAILY BONUS ═══════════════
function checkDaily(){
  const today=new Date().toDateString();
  if(S.lastDaily===today) return;
  const bonus=Math.max(200, S.maxLv*50);
  const eBonus=Math.min(10, Math.floor(S.maxLv/2)+3);
  document.getElementById('daily-reward').textContent=`+${bonus}🪙  +${eBonus}⚡`;
  document.getElementById('daily-overlay').classList.remove('hidden');
}
function claimDaily(){
  const today=new Date().toDateString();
  const bonus=Math.max(200, S.maxLv*50);
  const eBonus=Math.min(10, Math.floor(S.maxLv/2)+3);
  S.coins+=bonus;
  S.energy=Math.min(MAX_ENERGY,S.energy+eBonus);
  S.lastDaily=today;
  document.getElementById('daily-overlay').classList.add('hidden');
  render(); save();
}

// ═══════════════ NEW BUILDING POPUP ═══════════════
function showNewBldg(lv){
  const b=BLDGS[lv-1];
  document.getElementById('nb-emo').textContent=b.e;
  document.getElementById('nb-name').textContent=b.name;
  document.getElementById('nb-lv').textContent='레벨 '+lv;
  document.getElementById('new-bldg').classList.remove('hidden');
}
function closeNewBldg(){ document.getElementById('new-bldg').classList.add('hidden'); }

// ═══════════════ EFFECTS ═══════════════
function spawnParticles(cellIdx, color){
  const cell=document.querySelector(`[data-idx="${cellIdx}"]`);
  if(!cell) return;
  const r=cell.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const colors=['#FFD700','#FF8C00','#FFF59D','#FF6B6B','#80CBC4','#ffffff', color];
  for(let i=0;i<10;i++){
    const p=document.createElement('div');
    const angle=(i/10)*Math.PI*2+(Math.random()-.5)*.6;
    const dist=28+Math.random()*36;
    const sz=4+Math.random()*6;
    p.className='ptcl';
    p.style.cssText=`left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;
      background:${colors[i%colors.length]};
      --tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),720);
  }
}
function popCell(idx){
  const c=document.querySelector(`[data-idx="${idx}"]`);
  if(!c) return;
  c.classList.add('pop');
  setTimeout(()=>c.classList.remove('pop'),380);
  // shine
  setTimeout(()=>{
    const card=c.querySelector('.item');
    if(card){ card.classList.add('shining'); setTimeout(()=>card.classList.remove('shining'),550); }
  },100);
}
function floatReward(txt, cellIdx, color='#FFF9C4'){
  const c=document.querySelector(`[data-idx="${cellIdx}"]`);
  if(!c) return;
  const r=c.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='flt'; el.textContent=txt;
  el.style.color=color;
  el.style.left=(r.left+r.width/2-16)+'px';
  el.style.top=r.top+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}
let comboTimer=null;
function showCombo(msg){
  const el=document.getElementById('combo-pop');
  el.textContent=msg;
  el.style.display='block';
  el.style.animation='comboIn .35s cubic-bezier(.34,1.56,.64,1) forwards';
  clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>{
    el.style.animation='comboOut .3s ease forwards';
    setTimeout(()=>{ el.style.display='none'; el.style.animation=''; },320);
  },1800);
}

// ═══════════════ TOAST ═══════════════
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),2400);
}

// ═══════════════ ENERGY TICK ═══════════════
function tick(){
  if(S.energy<MAX_ENERGY){
    const elapsed=Date.now()-S.lastEnergy;
    if(elapsed>=REGEN_MS){
      const gain=Math.floor(elapsed/REGEN_MS);
      S.energy=Math.min(MAX_ENERGY,S.energy+gain);
      S.lastEnergy=Date.now();
      save();
    }
  }
  renderHUD();
  renderEnergy();
}

// ═══════════════ SERVICE WORKER ═══════════════
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

// ═══════════════ BOOT ═══════════════
load();
computeSize();
render();
checkDaily();
setInterval(tick, 1000);
window.addEventListener('resize', ()=>{ computeSize(); render(); });
</script>
